<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng quan · FitReward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <script src="assets/js/store.js"></script>
  <script>requireSession();</script>
</head>
<body data-title-key="meta.title.dashboard">
  <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>

  <div id="app-dashboard-layout" class="app-shell">

    <!-- SIDEBAR -->
    <aside class="app-sidebar">
      <a href="index.html" class="logo sidebar-logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        </span>
        <span>Fit<span class="logo-accent">Reward</span></span>
      </a>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item" data-tab="overview" onclick="switchTab('overview')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
          <span data-i18n="nav.overview">Tổng quan</span>
        </button>
        <button type="button" class="nav-item" data-tab="rewards" onclick="switchTab('rewards')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
          <span data-i18n="nav.rewards">Phần thưởng</span>
        </button>
        <button type="button" class="nav-item" data-tab="challenges" onclick="switchTab('challenges')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
          <span data-i18n="nav.challenges">Thử thách</span>
        </button>
        <button type="button" class="nav-item" data-tab="profile" onclick="switchTab('profile')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span data-i18n="nav.profile">Hồ sơ</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="plus-card" id="sidebar-plus">
          <strong>FitReward Plus</strong>
          <p data-i18n="dash.plus.desc">Phần thưởng cao hơn và tính năng độc quyền.</p>
          <button type="button" class="pill-btn pill-btn-green pill-btn-block" data-soon="toast.comingSoon" data-i18n="dash.plus.cta">Nâng cấp – 49.000đ/tháng</button>
        </div>

        <div class="sidebar-utility">
          <button type="button" class="nav-item nav-logout" onclick="handleLogout()">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span data-i18n="nav.logout">Đăng xuất</span>
          </button>
          <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Ngôn ngữ">
            <button type="button" class="lang-btn" data-lang="vi" onclick="setLanguage('vi')">VI</button>
            <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN: page header + active tab, both rendered by dashboard.js -->
    <main class="app-main">
      <header class="page-head" id="page-head"></header>
      <div class="view" id="view"></div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="mobile-bottom-nav">
      <button type="button" class="m-nav-item" data-tab="overview" onclick="switchTab('overview')">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
        <span data-i18n="nav.overview">Tổng quan</span>
      </button>
      <button type="button" class="m-nav-item" data-tab="rewards" onclick="switchTab('rewards')">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
        <span data-i18n="nav.rewards">Phần thưởng</span>
      </button>
      <button type="button" class="m-nav-item" data-tab="challenges" onclick="switchTab('challenges')">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
        <span data-i18n="nav.challenges">Thử thách</span>
      </button>
      <button type="button" class="m-nav-item" data-tab="profile" onclick="switchTab('profile')">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span data-i18n="nav.profile">Hồ sơ</span>
      </button>
    </nav>
  </div>

  <script src="assets/js/locales/vi.js"></script>
  <script src="assets/js/locales/en.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
