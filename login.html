<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập · FitReward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script src="assets/js/store.js"></script>
  <script>redirectIfLoggedIn();</script>
</head>
<body data-title-key="meta.title.login">
  <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>

  <div class="auth-layout">

    <!-- LEFT: navy story panel -->
    <aside class="auth-aside">
      <a href="index.html" class="logo logo--light">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        </span>
        <span>Fit<span class="logo-accent">Reward</span></span>
      </a>

      <div class="auth-aside-body">
        <h2 class="auth-aside-title" data-i18n="auth.aside.login.title">Chào mừng trở lại</h2>
        <p class="auth-aside-desc" data-i18n="auth.aside.login.desc">Tiếp tục tích FitPoints từ mỗi bước chân và đổi lấy phần thưởng thật.</p>
        <div class="auth-highlight">
          <span class="auth-highlight-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <div>
            <span class="auth-highlight-label" data-i18n="auth.aside.login.cardLabel">Mỗi ngày hoạt động</span>
            <strong data-i18n="auth.aside.login.cardValue">Tối đa 100 FitPoints ≈ 5.000đ</strong>
          </div>
        </div>
      </div>

      <p class="auth-aside-note" data-i18n="auth.aside.login.note">Dữ liệu được mã hóa AES-256 · Tuân thủ Nghị định 13/2023/NĐ-CP</p>
    </aside>

    <!-- RIGHT: login form -->
    <main class="auth-main">
      <div class="auth-topbar">
        <a href="index.html" class="auth-back">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span data-i18n="auth.backHome">Trang chủ</span>
        </a>
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Ngôn ngữ">
          <button type="button" class="lang-btn" data-lang="vi" onclick="setLanguage('vi')">VI</button>
          <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        </div>
      </div>

      <div class="auth-form-wrap">
        <div id="screen-login" class="auth-panel active">
          <h1 class="auth-title" data-i18n="auth.login.title">Đăng nhập</h1>
          <p class="auth-switch">
            <span data-i18n="auth.login.noAccount">Chưa có tài khoản?</span>
            <a href="register.html" class="auth-link" data-i18n="auth.login.signupLink">Đăng ký miễn phí</a>
          </p>

          <form id="login-form" novalidate onsubmit="handleLogin(event)">
            <div class="field">
              <label for="login-identifier" class="field-label" data-i18n="auth.field.emailOrPhone">Email hoặc số điện thoại</label>
              <input type="text" id="login-identifier" class="field-input" placeholder="minhanh@email.com" autocomplete="username" inputmode="email">
              <span class="error-text" id="login-identifier-error"></span>
            </div>

            <div class="field">
              <div class="field-label-row">
                <label for="login-password" class="field-label" data-i18n="auth.field.password">Mật khẩu</label>
                <a href="#" class="auth-link auth-link-plain" data-soon="toast.comingSoon" data-i18n="auth.login.forgot">Quên mật khẩu?</a>
              </div>
              <div class="field-control">
                <input type="password" id="login-password" class="field-input" placeholder="Nhập mật khẩu" data-i18n-placeholder="auth.field.passwordPlaceholder" autocomplete="current-password">
                <button type="button" class="eye-toggle-btn" aria-label="Hiển thị mật khẩu" data-i18n-aria-label="aria.showPassword" onclick="togglePasswordVisibility('login-password', this)">
                  <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
              <span class="error-text" id="login-password-error"></span>
            </div>

            <label class="check">
              <input type="checkbox" id="login-remember">
              <span data-i18n="auth.login.remember">Ghi nhớ đăng nhập</span>
            </label>

            <button type="submit" class="auth-btn auth-btn-primary" data-i18n="auth.login.submit">Đăng nhập</button>
          </form>

          <div class="auth-divider"><span data-i18n="auth.or">hoặc</span></div>

          <div class="auth-social">
            <button type="button" class="auth-btn auth-btn-outline" data-soon="toast.googleSoon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
              <span data-i18n="auth.social.google">Tiếp tục với Google</span>
            </button>
            <button type="button" class="auth-btn auth-btn-outline" data-soon="toast.appleSoon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
              <span data-i18n="auth.social.apple">Tiếp tục với Apple</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/locales/vi.js"></script>
  <script src="assets/js/locales/en.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
